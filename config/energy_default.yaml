hardware:
  port: null
  baudrate: 115200
  timeout: 1.0
  use_simulation_fallback: true
  sampling_interval_seconds: 0.5

grid:
  nominal_voltage: 230.0
  nominal_frequency: 50.0
  voltage_sag_threshold: 207.0
  voltage_swell_threshold: 253.0
  low_pf_threshold: 0.85
  spike_power_threshold_kw: 2.5
  cost_per_kwh: 0.15

storage:
  sqlite_path: "logs/energy_events.sqlite3"
  wal_mode: true
  history_retention_days: 30

dashboard:
  enabled: true
  # Panoda kimlik dogrulama yok. Ag uzerinden erisim gerekiyorsa "0.0.0.0" yapin.
  host: "127.0.0.1"
  port: 8050

mqtt:
  # Kapaliyken uygulama tamamen yerel calisir; MQTT bir ek yetenektir.
  enabled: false
  host: "localhost"
  port: 1883
  username: null
  password: null
  client_id: "smart-energy"
  base_topic: "smart-energy"
  qos: 0
  tls: false
  # ESP32 WiFi uzerinden yayin yapiyorsa ham olcumleri seri port yerine
  # MQTT'den al. Firmware'deki MQTT_BASE_TOPIC ile ayni olmalidir.
  ingest_device_samples: false

load_shedding:
  enabled: false
  # restore < shed olmali; aradaki fark histerezis bandidir ve rolenin
  # esik civarinda surekli acilip kapanmasini engeller.
  shed_threshold_kw: 3.0
  restore_threshold_kw: 2.0
  # Anlik akim sicramalarinin yuku bosuna kesmemesi icin ust uste kac olcum
  # gerektigi.
  confirm_samples: 3
  min_action_interval_seconds: 30.0
  shed_command: "SHED_LOAD"
  restore_command: "CONNECT_LOAD"
